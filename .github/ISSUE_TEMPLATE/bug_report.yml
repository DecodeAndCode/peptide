name: Bug report
description: Report a reproducible problem in SuppGO.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve SuppGO. Please include enough detail for a contributor to reproduce the issue."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, test account state, or inputs needed.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, environment, screenshots, logs, or related links.
    validations:
      required: false
